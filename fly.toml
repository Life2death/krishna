# Krishna Brain — Fly.io deployment
# Deploy: flyctl deploy (from repo root)
# Build context = repo root (Dockerfile at apps/brain/Dockerfile)

app = "krishna-brain"
primary_region = "bom"

[build]
  dockerfile = "apps/brain/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[env]
  KRISHNA_BRAIN_HOST = "0.0.0.0"
  KRISHNA_DB_PATH = "/tmp/krishna-brain.db"
  KRISHNA_SYNC_INTERVAL = "60"
  KRISHNA_RAG_DISABLED = "false"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
